name: Sync stable release to SourceForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub release tag to synchronize
        required: true
        default: v1.7.0
        type: string

permissions:
  contents: read

concurrency:
  group: sourceforge-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize stable release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Synchronize release files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCEFORGE_PROJECT: rme-pdf-scanner
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
        run: python3 .github/scripts/sourceforge_release_sync.py --tag "$RELEASE_TAG"
